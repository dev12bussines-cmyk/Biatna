<script>
    async function startWebcam() {
        const videoElement = document.getElementById('webcam');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "environment",
                    width: { ideal: 640 },
                    height: { ideal: 640 }
                },
                audio: false
            });

            videoElement.srcObject = stream;
        } catch (error) {
            console.error("تعذر الوصول للكاميرا:", error);
            alert("يرجى السماح بصلاحية الوصول للكاميرا لتشغيل الفحص.");
        }
    }

    window.addEventListener('DOMContentLoaded', startWebcam);
</script>

<script>
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/b2rA1dFwt/";

let model;

const recyclingData = {
    "plastic": {
        name: "بلاستيك",
        bin: "الصندوق الأصفر (البلاستيك)",
        instructions: "إفراغ السائل، ضغط الزجاجة لتوفير المساحة، وإغلاق الغطاء."
    },
    "aluminum_metal": {
        name: "معادن / ألومنيوم",
        bin: "الصندوق الفضي / المعادن",
        instructions: "ضغط العلبة يدوياً وتقليل حجمها قبل إلقائها."
    },
    "cardboard": {
        name: "كرتون وورق مقوى",
        bin: "الصندوق الأزرق (الورق والكرتون)",
        instructions: "إزالة أي مواد بلاستيكية أو شريط لاصق وطَي العبوة تماماً."
    },
    "glass": {
        name: "زجاج",
        bin: "الصندوق الأخضر (الزجاج)",
        instructions: "التأكد من أن الزجاج غير مكسور وفصل الأغطية المعدنية."
    }
};

async function loadModel() {
    const modelPath = MODEL_URL + "model.json";
    const metadataPath = MODEL_URL + "metadata.json";

    try {
        model = await tmImage.load(modelPath, metadataPath);
        console.log("تم تحميل نموذج الذكاء الاصطناعي بنجاح.");
        document.getElementById("resultTitle").innerText = "الكاميرا جاهزة للفحص";
        document.getElementById("resultBin").innerText = "♻️ صندوق الإلقاء: جاهز";
        document.getElementById("resultInstructions").innerText = "💡 الإرشادات: ضع المخلفات أمام الكاميرا";
    } catch (error) {
        console.error("خطأ في تحميل النموذج:", error);
        document.getElementById("resultTitle").innerText = "خطأ في التحميل";
    }
}

async function classifyFrame(videoElement) {
    if (!model || !videoElement || videoElement.readyState !== videoElement.HAVE_ENOUGH_DATA) {
        return null;
    }

    const predictions = await model.predict(videoElement);
    predictions.sort((a, b) => b.probability - a.probability);
    const topMatch = predictions[0];

    if (topMatch.probability > 0.80) {
        const classKey = topMatch.className;
        const details = recyclingData[classKey] || {
            name: classKey,
            bin: "عام",
            instructions: "إعادة تدوير عامة."
        };

        return {
            className: classKey,
            confidence: (topMatch.probability * 100).toFixed(0),
            details: details
        };
    }

    return null;
}

function startPredictionLoop(videoElement, onResultCallback) {
    async function loop() {
        const result = await classifyFrame(videoElement);
        if (result && typeof onResultCallback === 'function') {
            onResultCallback(result);
        }
        requestAnimationFrame(loop);
    }
    loop();
}

window.addEventListener('DOMContentLoaded', async () => {
    await loadModel();
    
    const myVideoElement = document.getElementById('webcam'); 
    
    startPredictionLoop(myVideoElement, (data) => {
        // تحديث النصوص مباشرة فوق الكاميرا للمواطن
        document.getElementById('resultTitle').innerText = `المنتج: ${data.details.name} (${data.confidence}%)`;
        document.getElementById('resultBin').innerText = `♻️ صندوق الإلقاء: ${data.details.bin}`;
        document.getElementById('resultInstructions').innerText = `💡 الإرشادات: ${data.details.instructions}`;
    });
});
</script>
